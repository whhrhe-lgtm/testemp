name: Build Kivy APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # استخدام بايثون 3.10 وهو الإصدار الأكثر استقراراً وتوافقاً مع نسخ الكومبايلر الحالية لـ Kivy
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libunwind-dev
          sudo apt-get install -f -y
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good libsqlite3-dev \
            sqlite3 bzip2 libbz2-dev libffi-dev libssl-dev openssl libgdbm-dev \
            libncursesw5-dev libtinfo-dev libreadline-dev tk-dev uuid-dev \
            liblzma-dev unzip zip openjdk-17-jdk

      # تثبيت نسخ محددة ومجربة من Cython و Buildozer لمنع أخطاء التجميع (Compilation Errors)
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0"
          pip install buildozer setuptools

      # تشغيل البناء مع إضافة أمر لتنظيف الكاش القديم قبل البدء للتأكد من عدم وجود تضارب
      - name: Build APK with Buildozer
        run: |
          buildozer android clean
          yes | buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "y"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: testemp-Debug-APK
          path: bin/*.apk
          
