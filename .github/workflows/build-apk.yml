name: Build Kivy APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libunwind-dev
          sudo apt-get install -f -y
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good libsqlite3-dev \
            sqlite3 bzip2 libbz2-dev libffi-dev libssl-dev openssl libgdbm-dev \
            libncursesw5-dev libtinfo-dev libreadline-dev tk-dev uuid-dev \
            liblzma-dev unzip zip

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools virtualenv
          pip install "cython>=0.29.33,<3.0.0"
          pip install buildozer

      # قمنا بإضافة أمر مسح يدوي للمجلد التالف قبل بدء التجميع النظيف لمنع التوقف الصامت
      - name: Build APK with Buildozer
        run: |
          rm -rf .buildozer
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "y"
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

      - name: Upload Finished APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: testemp-Successful-APK
          path: bin/*.apk
          
